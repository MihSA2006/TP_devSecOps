apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-ingress
  namespace: default
  annotations:
    # Indique à Kubernetes d'utiliser l'Ingress Controller Nginx de Minikube
    kubernetes.io/ingress.class: "nginx"
    # Redirige automatiquement le HTTP vers le HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - portfolio.local
    secretName: portfolio-tls-secret
  rules:
  - host: portfolio.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: portfolio-service
            port:
              number: 80
